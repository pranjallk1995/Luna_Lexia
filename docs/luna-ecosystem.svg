<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 940" width="1300" height="940" role="img" aria-label="Clients reach six Luna apps through a Cloudflare tunnel. Luna Unia, one home page, checks which Luna apps are running and opens each one with the shared sign-in. Every app runs a Streamlit UI and a FastMCP service on the shared luna_sentia_network, and relies on Luna Sentia for sign-on, PostgreSQL and Ollama. Luna Vibia tells Luna Lumia the mood of the playing track for its music schemes. Every app asks Ollama for the same 16k context, so they share one loaded copy of Qwen3-VL.">
  <style>
svg{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.b{font-weight:600}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11px}
.bg{fill:#ffffff}.hc{fill:#1b2230}.hl{fill:#b4661a}.hp{fill:#8a92a3}
.box{fill:#ffffff;stroke:#c9cfda;stroke-width:1.2}.app{fill:#f5f6f8;stroke:#c9cfda}
.core{fill:#e3f0f1;stroke:#1f6f78;stroke-width:1.4}.ext{fill:none;stroke:#5d6677;stroke-dasharray:4 3}
.net{fill:none;stroke:#1f6f78;stroke-width:1.5;stroke-dasharray:8 5}.zone{fill:none;stroke:#1f6f78;stroke-opacity:.5}
.arrow{stroke:#1b2230;stroke-width:1.3;fill:none}.rule,.rule line{stroke:#1b2230;stroke-opacity:.45}
.xlink{stroke:#b4661a;stroke-width:1.6;fill:none}.plan{stroke:#8a92a3;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
.mlink{stroke:#7b4fc9;stroke-width:1.6;fill:none}.hm{fill:#7b4fc9}.lm{fill:#7b4fc9;font-size:11px;font-weight:500}
.t{fill:#1b2230;font-size:13px}.s{fill:#5d6677;font-size:11px}.m{fill:#5d6677}.mc{fill:#1f6f78}
.lbl{fill:#1b2230;font-size:11px}.lk{fill:#b4661a;font-size:11px;font-weight:500}.pl{fill:#8a92a3;font-size:11px;font-style:italic}
.ct{fill:#1f6f78;font-size:12px;font-weight:600;letter-spacing:.08em}
@media (prefers-color-scheme:dark){
.bg{fill:#1a2029}.hc{fill:#e4e8ef}.hl{fill:#e3a35f}.hp{fill:#78819a}
.box{fill:#1a2029;stroke:#343d4b;stroke-width:1.2}.app{fill:#11151c;stroke:#343d4b}
.core{fill:#17303a;stroke:#5fb8c1;stroke-width:1.4}.ext{fill:none;stroke:#98a2b3;stroke-dasharray:4 3}
.net{fill:none;stroke:#5fb8c1;stroke-width:1.5;stroke-dasharray:8 5}.zone{fill:none;stroke:#5fb8c1;stroke-opacity:.5}
.arrow{stroke:#e4e8ef;stroke-width:1.3;fill:none}.rule,.rule line{stroke:#e4e8ef;stroke-opacity:.45}
.xlink{stroke:#e3a35f;stroke-width:1.6;fill:none}.plan{stroke:#78819a;stroke-width:1.4;fill:none;stroke-dasharray:5 4}
.mlink{stroke:#b394f0;stroke-width:1.6;fill:none}.hm{fill:#b394f0}.lm{fill:#b394f0;font-size:11px;font-weight:500}
.t{fill:#e4e8ef;font-size:13px}.s{fill:#98a2b3;font-size:11px}.m{fill:#98a2b3}.mc{fill:#5fb8c1}
.lbl{fill:#e4e8ef;font-size:11px}.lk{fill:#e3a35f;font-size:11px;font-weight:500}.pl{fill:#78819a;font-size:11px;font-style:italic}
.ct{fill:#5fb8c1;font-size:12px;font-weight:600;letter-spacing:.08em}
}
</style>
<rect class="bg" x="0" y="0" width="1300" height="940" rx="10"/>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hc"/></marker>
    <marker id="ahl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hl"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hp"/></marker>
    <marker id="ahm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="hm"/></marker>
  </defs>

  <!-- Clients -->
  <rect class="box" x="230" y="18" width="260" height="56" rx="8"/>
  <text class="t b" x="360" y="42" text-anchor="middle">You, in a browser</text>
  <text class="s" x="360" y="60" text-anchor="middle">one Google sign-in opens every app</text>
  <rect class="box" x="810" y="18" width="260" height="56" rx="8"/>
  <text class="t b" x="940" y="42" text-anchor="middle">AI assistants</text>
  <text class="s" x="940" y="60" text-anchor="middle">Claude, ChatGPT as MCP clients</text>
  <line class="arrow" x1="360" y1="74" x2="360" y2="108" marker-end="url(#ah)"/>
  <line class="arrow" x1="940" y1="74" x2="940" y2="108" marker-end="url(#ah)"/>

  <!-- Tunnel -->
  <rect class="box" x="50" y="110" width="1200" height="38" rx="6"/>
  <text class="t" x="650" y="134" text-anchor="middle"><tspan class="b">Cloudflare tunnel</tspan> · <tspan class="m">*.lunaapps.fyi</tspan> → host ports bound to 127.0.0.1</text>
  <line class="arrow" x1="360" y1="148" x2="360" y2="178" marker-end="url(#ah)"/>
  <text class="lbl" x="370" y="168">HTTPS → Streamlit UIs</text>
  <line class="arrow" x1="940" y1="148" x2="940" y2="178" marker-end="url(#ah)"/>
  <text class="lbl" x="950" y="168">HTTPS → /mcp and REST APIs</text>

  <!-- Network -->
  <rect class="net" x="30" y="180" width="1240" height="655" rx="12"/>
  <text class="m mc" x="1256" y="198" text-anchor="end">luna_sentia_network (Docker bridge)</text>

  <!-- Luna Unia -->
  <rect class="box" x="50" y="208" width="1200" height="46" rx="8"/>
  <text class="t" x="650" y="228" text-anchor="middle"><tspan class="b">Luna Unia</tspan> · one home for every app · Streamlit UI <tspan class="m">luna-unia-ui :42069</tspan></text>
  <text class="s" x="650" y="244" text-anchor="middle">checks each app's UI and MCP health over the network, then opens the running ones with the shared sign-in</text>
  <g>
    <line class="arrow" x1="142" y1="254" x2="142" y2="268" marker-end="url(#ah)"/>
    <line class="arrow" x1="345" y1="254" x2="345" y2="268" marker-end="url(#ah)"/>
    <line class="arrow" x1="548" y1="254" x2="548" y2="268" marker-end="url(#ah)"/>
    <line class="arrow" x1="751" y1="254" x2="751" y2="268" marker-end="url(#ah)"/>
    <line class="arrow" x1="954" y1="254" x2="954" y2="268" marker-end="url(#ah)"/>
    <line class="arrow" x1="1157" y1="254" x2="1157" y2="268" marker-end="url(#ah)"/>
  </g>

  <!-- App columns: x = 50, 253, 456, 659, 862, 1065; width 184 -->
  <g>
    <text class="t b" x="142" y="282" text-anchor="middle">Luna Visia</text>
    <text class="s" x="142" y="298" text-anchor="middle">image vault, AI captions</text>
    <text class="t b" x="345" y="282" text-anchor="middle">Luna Vita</text>
    <text class="s" x="345" y="298" text-anchor="middle">nutrition and fitness</text>
    <text class="t b" x="548" y="282" text-anchor="middle">Luna Lumia</text>
    <text class="s" x="548" y="298" text-anchor="middle">smart lights</text>
    <text class="t b" x="751" y="282" text-anchor="middle">Luna Fiora</text>
    <text class="s" x="751" y="298" text-anchor="middle">personal finance · WIP</text>
    <text class="t b" x="954" y="282" text-anchor="middle">Luna Lexia</text>
    <text class="s" x="954" y="298" text-anchor="middle">financial documents</text>
    <text class="t b" x="1157" y="282" text-anchor="middle">Luna Vibia</text>
    <text class="s" x="1157" y="298" text-anchor="middle">music library · WIP</text>
  </g>
  <!-- UI boxes -->
  <g>
    <rect class="app" x="50" y="308" width="184" height="42" rx="6"/>
    <rect class="app" x="253" y="308" width="184" height="42" rx="6"/>
    <rect class="app" x="456" y="308" width="184" height="42" rx="6"/>
    <rect class="app" x="659" y="308" width="184" height="42" rx="6"/>
    <rect class="app" x="862" y="308" width="184" height="42" rx="6"/>
    <rect class="app" x="1065" y="308" width="184" height="42" rx="6"/>
    <text class="t" x="142" y="326" text-anchor="middle">Streamlit UI</text><text class="m" x="142" y="342" text-anchor="middle">:18501</text>
    <text class="t" x="345" y="326" text-anchor="middle">Streamlit UI</text><text class="m" x="345" y="342" text-anchor="middle">:18502</text>
    <text class="t" x="548" y="326" text-anchor="middle">Streamlit UI</text><text class="m" x="548" y="342" text-anchor="middle">:18503</text>
    <text class="t" x="751" y="326" text-anchor="middle">Streamlit UI</text><text class="m" x="751" y="342" text-anchor="middle">:18504</text>
    <text class="t" x="954" y="326" text-anchor="middle">Streamlit UI</text><text class="m" x="954" y="342" text-anchor="middle">:18505</text>
    <text class="t" x="1157" y="326" text-anchor="middle">Streamlit UI</text><text class="m" x="1157" y="342" text-anchor="middle">:18506</text>
  </g>
  <!-- UI -> MCP -->
  <g>
    <line class="arrow" x1="142" y1="350" x2="142" y2="386" marker-end="url(#ah)"/>
    <line class="arrow" x1="345" y1="350" x2="345" y2="386" marker-end="url(#ah)"/>
    <line class="arrow" x1="548" y1="350" x2="548" y2="386" marker-end="url(#ah)"/>
    <line class="arrow" x1="751" y1="350" x2="751" y2="386" marker-end="url(#ah)"/>
    <line class="arrow" x1="954" y1="350" x2="954" y2="386" marker-end="url(#ah)"/>
    <line class="arrow" x1="1157" y1="350" x2="1157" y2="386" marker-end="url(#ah)"/>
    <text class="s" x="150" y="372">REST + bearer token</text>
    <text class="s" x="353" y="372">REST + bearer token</text>
    <text class="s" x="556" y="372">REST + bearer token</text>
    <text class="s" x="759" y="372">REST + bearer token</text>
    <text class="s" x="962" y="372">REST + bearer token</text>
    <text class="s" x="1165" y="372">REST + bearer token</text>
  </g>
  <!-- MCP boxes -->
  <g>
    <rect class="box" x="50" y="388" width="184" height="82" rx="6"/>
    <rect class="box" x="253" y="388" width="184" height="82" rx="6"/>
    <rect class="box" x="456" y="388" width="184" height="82" rx="6"/>
    <rect class="box" x="659" y="388" width="184" height="82" rx="6"/>
    <rect class="box" x="862" y="388" width="184" height="82" rx="6"/>
    <rect class="box" x="1065" y="388" width="184" height="82" rx="6"/>
    <text class="t b" x="142" y="408" text-anchor="middle">FastMCP + REST</text><text class="m" x="142" y="424" text-anchor="middle">luna-visia-mcp :18000</text>
    <text class="s" x="142" y="444" text-anchor="middle">LangGraph: vision tags</text><text class="s" x="142" y="460" text-anchor="middle">volume: image files</text>
    <text class="t b" x="345" y="408" text-anchor="middle">FastMCP + REST</text><text class="m" x="345" y="424" text-anchor="middle">luna-vita-mcp :18001</text>
    <text class="s" x="345" y="444" text-anchor="middle">no local LLM: the assistant</text><text class="s" x="345" y="460" text-anchor="middle">estimates macros</text>
    <text class="t b" x="548" y="408" text-anchor="middle">FastMCP + REST</text><text class="m" x="548" y="424" text-anchor="middle">luna-lumia-mcp :18002</text>
    <text class="s" x="548" y="444" text-anchor="middle">→ WiZ bulbs on home LAN</text><text class="s" x="548" y="460" text-anchor="middle">schedules · weather · music</text>
    <text class="t b" x="751" y="408" text-anchor="middle">FastMCP + REST</text><text class="m" x="751" y="424" text-anchor="middle">luna-fiora-mcp :18003</text>
    <text class="s" x="751" y="444" text-anchor="middle">→ Gmail API (read-only)</text><text class="s" x="751" y="460" text-anchor="middle">LangGraph: bank-msg import</text>
    <text class="t b" x="954" y="408" text-anchor="middle">FastMCP + REST</text><text class="m" x="954" y="424" text-anchor="middle">luna-lexia-mcp :18004</text>
    <text class="s" x="954" y="444" text-anchor="middle">Docling · LibreOffice · → Drive</text><text class="s" x="954" y="460" text-anchor="middle">reads next file during AI calls</text>
    <text class="t b" x="1157" y="408" text-anchor="middle">FastMCP + REST</text><text class="m" x="1157" y="424" text-anchor="middle">luna-vibia-mcp :18005</text>
    <text class="s" x="1157" y="444" text-anchor="middle">CLAP on CPU: listen + embed</text><text class="s" x="1157" y="460" text-anchor="middle">LangGraph: captions, tags</text>
  </g>

  <!-- Cross-app links -->
  <polyline class="xlink" points="162,470 162,492 345,492 345,474" marker-end="url(#ahl)"/>
  <text class="lk" x="263" y="487" text-anchor="middle">food image URLs for Vita</text>
  <polyline class="xlink" points="122,470 122,512 548,512 548,474" marker-end="url(#ahl)"/>
  <text class="lk" x="345" y="528" text-anchor="middle">room image URLs for Lumia</text>
  <polyline class="plan" points="954,470 954,492 771,492 771,474" marker-end="url(#ahp)"/>
  <text class="pl" x="862" y="487" text-anchor="middle">planned: tax details for Fiora</text>
  <polyline class="plan" points="82,470 82,502 731,502 731,474" marker-end="url(#ahp)"/>
  <text class="pl" x="741" y="528">planned: image and icon URLs for Fiora</text>
  <polyline class="xlink" points="62,470 62,536 1157,536 1157,474" marker-end="url(#ahl)"/>
  <text class="lk" x="1147" y="528" text-anchor="end">cover art URLs for Vibia</text>
  <polyline class="mlink" points="1177,470 1177,550 588,550 588,474" marker-end="url(#ahm)"/>
  <text class="lm" x="882" y="566" text-anchor="middle">playing track's mood for Lumia's music schemes</text>

  <g transform="translate(0,30)">
  <!-- Bus to Sentia -->
  <line x1="50" y1="566" x2="1250" y2="566" class="rule" stroke-opacity=".45"/>
  <g class="rule" stroke-opacity=".45">
    <line x1="142" y1="558" x2="142" y2="566"/><line x1="345" y1="558" x2="345" y2="566"/><line x1="548" y1="558" x2="548" y2="566"/><line x1="751" y1="558" x2="751" y2="566"/><line x1="954" y1="558" x2="954" y2="566"/><line x1="1157" y1="558" x2="1157" y2="566"/>
  </g>
  <line class="arrow" x1="160" y1="566" x2="160" y2="638" marker-end="url(#ah)"/>
  <text class="lbl" x="168" y="594">every UI: check luna_sso cookie</text>
  <line class="arrow" x1="500" y1="566" x2="500" y2="638" marker-end="url(#ah)"/>
  <text class="lbl" x="508" y="594">every MCP: own role + database</text>
  <line class="arrow" x1="1080" y1="566" x2="1080" y2="638" marker-end="url(#ah)"/>
  <text class="lbl" x="1072" y="588" text-anchor="end">Visia, Fiora, Lexia, Vibia MCPs:</text>
  <text class="lbl" x="1072" y="602" text-anchor="end">vision, text, embeddings at 16k</text>

  <!-- Sentia -->
  <rect class="zone" x="42" y="612" width="1216" height="182" rx="10"/>
  <text class="ct" x="168" y="630">LUNA SENTIA · STARTS FIRST</text>

  <rect class="core" x="60" y="640" width="200" height="90" rx="8"/>
  <text class="t b" x="160" y="662" text-anchor="middle">Single sign-on</text>
  <text class="m" x="160" y="678" text-anchor="middle">luna-sentia-auth :19090</text>
  <text class="s" x="160" y="698" text-anchor="middle">Starlette · luna_sso cookie</text>
  <text class="s" x="160" y="714" text-anchor="middle">sign out once = out of all</text>

  <line class="arrow" x1="260" y1="685" x2="338" y2="685" marker-end="url(#ah)"/>
  <text class="s" x="299" y="678" text-anchor="middle">sessions</text>

  <rect class="core" x="340" y="640" width="320" height="90" rx="8"/>
  <text class="t b" x="500" y="662" text-anchor="middle">PostgreSQL 17 + pgvector</text>
  <text class="m" x="500" y="678" text-anchor="middle">luna-sentia-db · no host port</text>
  <text class="m" x="500" y="698" text-anchor="middle">lunavisia · lunavita · lunalumia</text>
  <text class="m" x="500" y="714" text-anchor="middle">lunafiora · lunalexia · lunavibia · lunaauth</text>

  <line class="arrow" x1="710" y1="685" x2="662" y2="685" marker-end="url(#ah)"/>
  <text class="s" x="686" y="678" text-anchor="middle">reads</text>
  <rect class="box" x="710" y="640" width="120" height="90" rx="8"/>
  <text class="t b" x="770" y="670" text-anchor="middle">Adminer</text>
  <text class="m" x="770" y="688" text-anchor="middle">:19080</text>
  <text class="s" x="770" y="708" text-anchor="middle">browse any DB</text>

  <rect class="core" x="920" y="640" width="320" height="90" rx="8"/>
  <text class="t b" x="1080" y="658" text-anchor="middle">Ollama</text>
  <text class="m" x="1080" y="674" text-anchor="middle">luna-sentia-ollama:11434 · no host port</text>
  <text class="m" x="1080" y="690" text-anchor="middle">qwen3-vl:8b-instruct · qwen3-embedding:0.6b</text>
  <text class="s" x="1080" y="707" text-anchor="middle">one shared 16k context · one request at a time</text>
  <text class="s" x="1080" y="723" text-anchor="middle">flash attention · 8-bit KV cache</text>

  <rect class="ext" x="340" y="746" width="320" height="32" rx="6"/>
  <text class="s" x="500" y="766" text-anchor="middle">postgres-init (one-shot): creates roles + DBs</text>
  <line x1="500" y1="730" x2="500" y2="746" class="rule" stroke-opacity=".45"/>
  <rect class="ext" x="920" y="746" width="200" height="32" rx="6"/>
  <text class="s" x="1020" y="766" text-anchor="middle">ollama-pull (one-shot)</text>
  <line x1="1020" y1="730" x2="1020" y2="746" class="rule" stroke-opacity=".45"/>

  <!-- External -->
  <line class="arrow" x1="160" y1="730" x2="160" y2="842" marker-end="url(#ah)"/>
  <text class="lbl" x="168" y="825">OpenID Connect</text>
  <rect class="ext" x="60" y="844" width="200" height="46" rx="6"/>
  <text class="t" x="160" y="865" text-anchor="middle">Google sign-in</text>
  <text class="s" x="160" y="881" text-anchor="middle">allowlisted emails only</text>

  <line class="arrow" x1="1180" y1="730" x2="1180" y2="842" marker-end="url(#ah)"/>
  <text class="lbl" x="1172" y="825" text-anchor="end">gpus: all</text>
  <rect class="ext" x="1040" y="844" width="200" height="46" rx="6"/>
  <text class="t" x="1140" y="865" text-anchor="middle">NVIDIA GPU (WSL2 host)</text>
  <text class="s" x="1140" y="881" text-anchor="middle">qwen3-vl: 6.6 GB at 16k context</text>

  <rect class="ext" x="420" y="844" width="460" height="46" rx="6"/>
  <text class="t" x="650" y="865" text-anchor="middle">Docker volumes survive <tspan class="m">luna.sh stop</tspan></text>
  <text class="m" x="650" y="881" text-anchor="middle">postgres_data · ollama_data · image, document + track files</text>
  </g>
</svg>
